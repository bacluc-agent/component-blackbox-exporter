apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    test.annotation: demo
  labels:
    app.kubernetes.io/instance: blackbox-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: prometheus-blackbox-exporter
    app.kubernetes.io/version: v0.29.1
    helm.sh/chart: prometheus-blackbox-exporter-11.20.2
  name: blackbox-exporter-prometheus-blackbox-exporter
  namespace: syn-blackbox-exporter
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: blackbox-exporter
      app.kubernetes.io/name: prometheus-blackbox-exporter
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        checksum/config: f43e733459690a84886aec93596a01748c2f936776a534eeaeb9f084e62ebb91
      labels:
        app.kubernetes.io/instance: blackbox-exporter
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: prometheus-blackbox-exporter
        app.kubernetes.io/version: v0.29.1
        helm.sh/chart: prometheus-blackbox-exporter-11.20.2
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --config.file=/config/blackbox.yaml
          env:
            - name: TEST_ENV
              value: '1'
          image: quay.io/prometheus/blackbox-exporter:v0.29.1
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /-/healthy
              port: http
          name: blackbox-exporter
          ports:
            - containerPort: 9115
              name: http
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /config
              name: config
      hostNetwork: false
      nodeSelector:
        node-role.kubernetes.io/infra: ''
      restartPolicy: Always
      serviceAccountName: blackbox-exporter-prometheus-blackbox-exporter
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/infra
          operator: Exists
      volumes:
        - configMap:
            name: blackbox-exporter-prometheus-blackbox-exporter
          name: config
